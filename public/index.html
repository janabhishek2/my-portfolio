      rel="stylesheet"
    />
    <script>
      // Set the colour scheme before first paint to avoid a light/dark flash (mirrors Mantine's ColorSchemeScript).
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value');
        var scheme = stored && stored !== 'auto' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled.</noscript>
    <div id="root"></div>
  </body>
